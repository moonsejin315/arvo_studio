<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>ARVO STUDIO — 서울두피문신 SMP</title>
  <meta name="description" content="ARVO 아르보 | 서울 두피문신 SMP | 0.1mm Micro Dot | 개인별 두피 맞춤 모근 설계 | 2026.05 Open" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root{
      --bg:#0e0e0e; --bg2:#161616; --bg3:#1e1e1e;
      --text:#f0ede8; --muted:#888480; --dim:#4a4845;
      --line:rgba(240,237,232,.08); --line2:rgba(240,237,232,.16);
      --display:'Playfair Display',Georgia,serif;
      --kr:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
      --sans:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html{scroll-behavior:smooth;}
    body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:400;font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased;}
    .eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:400;}
    .btn-p{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;min-height:46px;background:var(--text);color:var(--bg);font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.04em;text-decoration:none;border:none;cursor:pointer;transition:opacity .2s;white-space:nowrap;}
    .btn-p:hover{opacity:.85;}
    .btn-s{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 28px;min-height:46px;background:transparent;color:var(--muted);font-family:var(--sans);font-size:13px;font-weight:400;letter-spacing:.04em;text-decoration:none;border:1px solid var(--line2);cursor:pointer;transition:color .2s,border-color .2s;white-space:nowrap;}
    .btn-s:hover{color:var(--text);border-color:var(--text);}
    @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes marqueeScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
    @keyframes pulse{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}

    /* ══ NAV ══ */
    #nav{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:58px;border-bottom:1px solid transparent;transition:background .3s,border-color .3s;}
    #nav.scrolled{background:rgba(14,14,14,.95);border-color:var(--line);backdrop-filter:blur(12px);}
    .nav-logo{font-family:var(--display);font-size:15px;letter-spacing:.2em;text-decoration:none;color:var(--text);font-style:italic;white-space:nowrap;font-weight:400;}
    .nav-links{display:none;align-items:center;gap:12px;}
    .nav-link{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);text-decoration:none;border:1px solid var(--line2);padding:7px 16px;transition:color .2s,border-color .2s;white-space:nowrap;}
    .nav-link:hover{color:var(--text);border-color:rgba(240,237,232,.4);}
    .hamburger{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;gap:5px;padding:8px;min-width:44px;min-height:44px;align-items:center;justify-content:center;}
    .hbar{display:block;width:22px;height:1.5px;background:var(--text);transition:transform .25s,opacity .25s;}
    #drawer{position:fixed;inset:0;z-index:199;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding-top:58px;animation:fadeIn .22s ease both;}
    #drawer.open{display:flex;}
    .drawer-link{font-size:13px;letter-spacing:.1em;color:var(--text);text-decoration:none;border:1px solid var(--line2);padding:12px 28px;text-align:center;min-width:160px;display:flex;align-items:center;justify-content:center;}

    /* ══ FLOAT CTA ══ */
    #floatCta{position:fixed;right:20px;bottom:28px;z-index:300;display:flex;flex-direction:column;gap:10px;align-items:stretch;width:158px;}
    .float-btn{display:flex;align-items:center;justify-content:flex-start;gap:9px;padding:11px 16px;min-height:46px;width:100%;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:.03em;text-decoration:none;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .2s,transform .18s;white-space:nowrap;}
    .float-btn:hover{opacity:.9;transform:translateY(-1px);}
    .float-btn.ig{background:var(--text);color:var(--bg);}
    .float-icon{font-size:15px;line-height:1;flex-shrink:0;}

    /* ══ HERO ══ */
    #hero{border-bottom:1px solid var(--line);padding-top:58px;position:relative;overflow:hidden;min-height:100svh;display:flex;align-items:center;}
    #hero::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,rgba(240,237,232,.07) 1px,transparent 1px);background-size:24px 24px;pointer-events:none;}
    .hero-inner{width:100%;max-width:1200px;margin:0 auto;padding:64px 24px 72px;display:grid;grid-template-columns:1fr;gap:40px;position:relative;z-index:1;}
    .hero-headline{font-family:var(--kr);font-size:clamp(34px,6vw,72px);font-weight:800;line-height:1.15;white-space:pre-line;word-break:keep-all;letter-spacing:-.03em;animation:fadeUp .8s .1s both;}
    .hero-right{display:flex;flex-direction:column;gap:24px;animation:fadeUp .8s .3s both;}
    .hero-open-badge{display:inline-flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);padding:10px 18px;font-size:12px;font-weight:600;letter-spacing:.06em;align-self:flex-start;}
    .hero-open-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:pulse 2s infinite;}
    .hero-sub{font-family:var(--kr);font-size:14px;font-weight:400;line-height:2;color:var(--muted);white-space:pre-line;word-break:keep-all;}
    .hero-dot-label{display:block;font-size:10px;letter-spacing:.22em;color:var(--dim);margin-bottom:10px;text-transform:uppercase;}
    .hero-visual{display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
    .hero-visual-num{font-family:var(--display);font-size:clamp(60px,11vw,120px);font-style:italic;font-weight:400;line-height:1;color:rgba(240,237,232,.06);letter-spacing:-.02em;user-select:none;}
    .hero-visual-label{font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--dim);}

    /* ══ MARQUEE ══ */
    .ticker{background:var(--text);overflow:hidden;padding:12px 0;}
    .ticker-track{display:flex;align-items:center;white-space:nowrap;animation:marqueeScroll 30s linear infinite;width:max-content;}
    .ticker-item{font-family:var(--display);font-style:italic;font-size:14px;color:rgba(14,14,14,.65);padding:0 28px;letter-spacing:.06em;}
    .ticker-sep{color:rgba(14,14,14,.25);font-size:13px;padding:0 4px;}

    /* ══ HOOK ══ */
    #hook{border-bottom:1px solid var(--line);background:var(--bg2);user-select:none;}
    .hook-inner{max-width:1200px;margin:0 auto;padding:52px 24px;}
    .hook-content{touch-action:pan-y;cursor:grab;min-height:170px;}
    .hook-content:active{cursor:grabbing;}
    .hook-main{font-family:var(--kr);font-size:clamp(22px,3.8vw,48px);font-weight:700;line-height:1.3;margin-bottom:16px;white-space:pre-line;word-break:keep-all;letter-spacing:-.02em;}
    .hook-sub{font-family:var(--kr);font-size:14px;color:var(--muted);max-width:520px;word-break:keep-all;min-height:52px;line-height:1.9;}
    .hook-controls{display:flex;align-items:center;justify-content:space-between;margin-top:28px;}
    .hook-dots{display:flex;gap:8px;align-items:center;}
    .hook-dot{height:4px;border-radius:2px;border:none;cursor:pointer;padding:0;transition:width .3s,background .3s;}
    .hook-arrows{display:flex;gap:8px;}
    .arrow-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line2);cursor:pointer;font-size:14px;color:var(--muted);transition:background .18s,color .18s;}
    .arrow-btn:hover{background:var(--text);color:var(--bg);}

    /* ══ 공통 ══ */
    .section-inner{max-width:1200px;margin:0 auto;padding:52px 24px;}
    .section-headline{font-family:var(--kr);font-weight:700;line-height:1.35;white-space:pre-line;word-break:keep-all;letter-spacing:-.02em;}

    /* ══ PROCESS ══ */
    #process{border-bottom:1px solid var(--line);background:var(--bg2);}
    .process-steps{display:grid;grid-template-columns:1fr;gap:1px;margin-top:36px;border:1px solid var(--line);}
    .process-step{padding:28px 24px;display:flex;align-items:flex-start;gap:20px;border-bottom:1px solid var(--line);}
    .process-step:last-child{border-bottom:none;}
    .step-num{font-family:var(--display);font-size:13px;color:var(--dim);font-style:italic;flex-shrink:0;padding-top:2px;min-width:52px;}
    .step-title{font-family:var(--kr);font-size:15px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em;}
    .step-desc{font-size:13px;color:var(--muted);line-height:1.85;word-break:keep-all;}

    /* ══ AS GUARANTEE ══ */
    #guarantee{border-bottom:1px solid var(--line);}
    .guarantee-inner{
      max-width:1200px;margin:0 auto;padding:52px 24px;
      display:grid;grid-template-columns:1fr;gap:40px;
    }
    .guarantee-left{}
    .guarantee-right{
      display:flex;align-items:flex-start;
      border-left:none;padding-left:0;
      align-self:start;
    }
    .guarantee-badge-row{display:flex;flex-direction:column;gap:12px;width:100%;}
    .g-badge{
      display:flex;align-items:center;gap:14px;
      padding:16px 20px;border:1px solid var(--line2);width:100%;
    }
    .g-badge-icon{font-size:22px;flex-shrink:0;}
    .g-badge-text{flex:1;}
    .g-badge-title{font-size:14px;font-weight:700;margin-bottom:2px;letter-spacing:-.01em;}
    .g-badge-sub{font-size:11px;color:var(--muted);letter-spacing:.02em;}
    .guarantee-desc{
      font-size:13px;color:var(--muted);line-height:1.95;
      word-break:keep-all;width:100%;
      border:1px solid var(--line);padding:24px;
      background:var(--bg2);
      align-self:stretch;
    }

    /* ══ BRAND ══ */
    #brand{border-bottom:1px solid var(--line);}
    .val-grid{display:grid;grid-template-columns:repeat(2,1fr);border:1px solid var(--line);}
    .val-cell{padding:22px;position:relative;overflow:hidden;}
    .val-cell::before{content:attr(data-letter);position:absolute;right:-6px;bottom:-14px;font-family:var(--display);font-style:italic;font-size:72px;line-height:1;color:rgba(240,237,232,.04);pointer-events:none;user-select:none;}
    .val-num{display:block;font-family:var(--display);font-size:13px;color:var(--text);letter-spacing:.04em;margin-bottom:6px;font-style:italic;font-weight:500;}
    .val-title{font-size:12px;font-weight:600;margin-bottom:5px;color:var(--muted);}
    .val-desc{font-size:12px;color:var(--muted);line-height:1.85;word-break:keep-all;}

    /* ══ DIAGNOSIS ══ */
    #diagnosis{border-bottom:1px solid var(--line);background:var(--bg2);}
    .diagnosis-layout{display:grid;grid-template-columns:1fr;gap:40px;margin-top:28px;}
    .diagnosis-title{font-family:var(--kr);font-size:clamp(20px,2.8vw,32px);font-weight:700;line-height:1.4;margin-bottom:12px;letter-spacing:-.02em;word-break:keep-all;}
    .diagnosis-sub{font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:22px;word-break:keep-all;max-width:440px;}
    .diagnosis-badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px;}
    .d-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border:1px solid var(--line2);font-size:11px;color:var(--muted);letter-spacing:.04em;}
    .d-badge-dot{width:5px;height:5px;border-radius:50%;background:#4ade80;flex-shrink:0;}

    /* 실제 진단 이미지 갤러리 */
    .diag-gallery{display:grid;grid-template-columns:1fr;gap:16px;}
    .diag-img-wrap{position:relative;border:1px solid var(--line2);overflow:hidden;background:var(--bg3);}
    .diag-img-wrap img{width:100%;display:block;object-fit:cover;}
    .diag-img-caption{position:absolute;bottom:0;left:0;right:0;background:rgba(14,14,14,.82);backdrop-filter:blur(6px);padding:10px 14px;font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}

    /* ══ SERVICES ══ */
    #services{border-bottom:1px solid var(--line);}
    .svc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
    .svc-title-text{font-family:var(--display);font-size:26px;font-weight:400;font-style:italic;}
    .svc-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:16px;padding:18px 10px;border-bottom:1px solid var(--line);transition:background .18s;}
    .svc-row:first-of-type{border-top:1px solid var(--line);}
    .svc-row:hover{background:rgba(240,237,232,.03);}
    .svc-idx{font-family:var(--display);font-size:11px;color:var(--dim);font-style:italic;}
    .svc-name{font-family:var(--kr);font-size:14px;font-weight:600;margin-bottom:2px;word-break:keep-all;}
    .svc-desc{font-size:12px;color:var(--muted);word-break:keep-all;}

    /* ══ FAQ ══ */
    #faq{border-bottom:1px solid var(--line);}
    .faq-list{margin-top:28px;}
    .faq-item{border-bottom:1px solid var(--line);}
    .faq-item:first-child{border-top:1px solid var(--line);}
    .faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 0;background:none;border:none;cursor:pointer;text-align:left;color:var(--text);}
    .faq-q-text{font-family:var(--kr);font-size:14px;font-weight:600;line-height:1.5;word-break:keep-all;letter-spacing:-.01em;}
    .faq-icon{font-size:18px;color:var(--dim);flex-shrink:0;transition:transform .25s;line-height:1;}
    .faq-icon.open{transform:rotate(45deg);}
    .faq-a{font-size:13px;color:var(--muted);line-height:1.9;padding:0 0 20px;word-break:keep-all;max-width:640px;display:none;}
    .faq-a.open{display:block;animation:fadeUp .3s ease both;}

    /* ══ CTA ══ */
    #cta{border-bottom:1px solid var(--line);background:var(--bg2);}
    .cta-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;}
    .blog-link{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.04em;transition:color .2s;border-bottom:1px solid var(--line2);padding-bottom:2px;}
    .blog-link:hover{color:var(--text);}

    /* ══ FOOTER ══ */
    footer{border-top:1px solid var(--line);}
    .lang-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin-bottom:22px;scrollbar-width:none;}
    .lang-row::-webkit-scrollbar{display:none;}
    .lang-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;min-height:34px;flex-shrink:0;border:1px solid var(--line2);cursor:pointer;background:transparent;transition:all .18s;}
    .lang-btn.active{background:var(--text);border-color:var(--text);}
    .lang-btn .flag{font-size:15px;line-height:1;}
    .lang-btn .lname{font-size:11px;letter-spacing:.04em;}
    .lang-btn.active .lname{color:var(--bg);font-weight:600;}
    .lang-btn:not(.active) .lname{color:var(--muted);}
    .lang-btn:not(.active):hover .lname{color:var(--text);}
    .footer-bottom{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;border-top:1px solid var(--line);padding-top:20px;}
    .footer-logo-text{font-family:var(--display);font-size:14px;letter-spacing:.2em;font-style:italic;}
    .footer-copy{font-size:11px;color:var(--dim);}
    .footer-link{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .2s;}
    .footer-link:hover{color:var(--text);}
    .footer-links{display:flex;gap:16px;align-items:center;}

    /* ══ REVEAL ══ */
    .reveal{opacity:0;transform:translateY(18px);transition:opacity .8s ease,transform .8s ease;}
    .reveal.in{opacity:1;transform:translateY(0);}

    /* ══ RESPONSIVE ══ */
    @media(min-width:768px){
      #nav{padding:0 48px;}
      .hamburger{display:none!important;}
      .nav-links{display:flex;}
      .hero-inner{grid-template-columns:3fr 2fr;padding:80px 48px 88px;gap:80px;align-items:center;}
      .hero-visual{align-items:flex-end;}
      .section-inner{padding-left:48px!important;padding-right:48px!important;}
      #cta .section-inner{padding-top:88px!important;padding-bottom:88px!important;}
      footer .section-inner{padding-bottom:80px!important;}
      .process-steps{grid-template-columns:repeat(4,1fr);}
      .process-step{border-bottom:none;border-right:1px solid var(--line);flex-direction:column;gap:16px;}
      .process-step:last-child{border-right:none;}
      .diagnosis-layout{grid-template-columns:1fr 1fr;align-items:start;}
      .diag-gallery{grid-template-columns:1fr 1fr;}
      .guarantee-inner{grid-template-columns:1fr 1fr;gap:48px;align-items:start;}
      .guarantee-right{border-left:1px solid var(--line);padding-left:48px;}
    }
    @media(max-width:767px){
      #floatCta{right:14px;bottom:20px;width:150px;}
      .hero-open-badge{font-size:12px;padding:9px 14px;}
      #hero{min-height:auto;}
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav id="nav">
  <a href="#" class="nav-logo">ARVO STUDIO</a>
  <div class="nav-links">
    <a href="https://blog.naver.com/the_arvo_studio" target="_blank" class="nav-link" id="navBlog">블로그</a>
    <a href="https://www.instagram.com/the_arvo_studio/" target="_blank" class="nav-link" id="navIg">Instagram ↗</a>
  </div>
  <button class="hamburger" id="hamburger" aria-label="메뉴">
    <span class="hbar" id="hb0"></span><span class="hbar" id="hb1"></span><span class="hbar" id="hb2"></span>
  </button>
</nav>
<div id="drawer">
  <a href="https://blog.naver.com/the_arvo_studio" target="_blank" class="drawer-link" id="drawerBlog">블로그</a>
  <a href="https://www.instagram.com/the_arvo_studio/" target="_blank" class="drawer-link" id="drawerIg">Instagram ↗</a>
</div>

<!-- FLOAT CTA -->
<div id="floatCta">
  <a href="https://www.instagram.com/the_arvo_studio/" target="_blank" class="float-btn ig">
    <span class="float-icon">📷</span><span id="f-ig">Instagram 문의</span>
  </a>
  <a href="http://pf.kakao.com/_ZAyxlX/chat" target="_blank" class="float-btn" id="floatSecond">
    <span class="float-icon">💬</span><span id="f-second">카카오 상담</span>
  </a>
</div>

<main>

<!-- HERO -->
<section id="hero">
  <div class="hero-inner">
    <div>
      <p class="eyebrow" id="h-eyebrow" style="margin-bottom:20px;animation:fadeUp .8s .05s both;display:block;"></p>
      <h1 class="hero-headline" id="h-headline"></h1>
    </div>
    <div class="hero-right">
      <div class="hero-open-badge"><span class="hero-open-dot"></span><span id="h-openbadge"></span></div>
      <p class="hero-sub"><span class="hero-dot-label" id="h-dot"></span><span id="h-sub"></span></p>
      <div class="hero-visual">
        <div class="hero-visual-num">0.1</div>
        <span class="hero-visual-label" id="h-visual-label">mm Micro Dot</span>
      </div>
    </div>
  </div>
</section>

<!-- MARQUEE -->
<div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>

<!-- HOOK -->
<section id="hook">
  <div class="hook-inner">
    <p class="eyebrow" id="hook-label" style="margin-bottom:22px;"></p>
    <div class="hook-content" id="hookContent">
      <h2 class="hook-main" id="hook-main"></h2>
      <p class="hook-sub" id="hook-sub"></p>
    </div>
    <div class="hook-controls">
      <div class="hook-dots" id="hookDots"></div>
      <div class="hook-arrows">
        <button class="arrow-btn" id="hookPrev">←</button>
        <button class="arrow-btn" id="hookNext">→</button>
      </div>
    </div>
  </div>
</section>

<!-- PROCESS -->
<section id="process" class="reveal">

let lang='ko', hookIdx=0, hookTimer=null;

function buildTicker(items){
  const d=[...items,...items];
  document.getElementById('tickerTrack').innerHTML=d.map(i=>`<span class="ticker-item">${i}</span><span class="ticker-sep">·</span>`).join('');
}

function render(){
  const t=I18N[lang];
  document.getElementById('navIg').textContent=t.nav.ig;
  document.getElementById('navBlog').textContent=t.nav.blog;
  document.getElementById('drawerIg').textContent=t.nav.ig;
  document.getElementById('drawerBlog').textContent=t.nav.blog;
  document.getElementById('f-ig').textContent=t.float.ig;
  document.getElementById('f-second').textContent=t.float.second;
  const fs=document.getElementById('floatSecond');
  if(lang==='ja'){fs.style.background='#06C755';fs.style.color='#fff';fs.style.boxShadow='0 4px 16px rgba(6,199,85,.3)';}
  else if(lang==='zh'){fs.style.background='#07C160';fs.style.color='#fff';fs.style.boxShadow='0 4px 16px rgba(7,193,96,.3)';}
  else{fs.style.background='#FEE500';fs.style.color='#1a1400';fs.style.boxShadow='0 4px 16px rgba(254,229,0,.18)';}

  document.getElementById('h-eyebrow').textContent=t.hero.eyebrow;
  document.getElementById('h-headline').textContent=t.hero.headline;
  document.getElementById('h-dot').textContent=t.hero.dotLabel;
  document.getElementById('h-sub').textContent=t.hero.sub;
  document.getElementById('h-openbadge').textContent=t.hero.openBadge;
  document.getElementById('h-visual-label').textContent=t.hero.visualLabel;
  buildTicker(t.ticker);
  document.getElementById('hook-label').textContent=t.hooks.label;
  renderHook(); renderHookDots();

  document.getElementById('p-label').textContent=t.process.label;
  document.getElementById('p-headline').textContent=t.process.headline;
  document.getElementById('processSteps').innerHTML=t.process.steps.map(s=>`
    <div class="process-step"><span class="step-num">${s.num}</span>
    <div><p class="step-title">${s.title}</p><p class="step-desc">${s.desc}</p></div></div>`).join('');

  document.getElementById('g-label').textContent=t.guarantee.label;
  document.getElementById('g-headline').textContent=t.guarantee.headline;
  document.getElementById('g-desc').textContent=t.guarantee.desc;
  document.getElementById('guaranteeBadges').innerHTML=t.guarantee.badges.map(b=>`
    <div class="g-badge">
      <span class="g-badge-icon">${b.icon}</span>
      <div class="g-badge-text">
        <p class="g-badge-title">${b.title}</p>
        <p class="g-badge-sub">${b.sub}</p>
      </div>
    </div>`).join('');

  document.getElementById('b-label').textContent=t.brand.label;
  document.getElementById('b-headline').textContent=t.brand.headline;
  document.getElementById('valGrid').innerHTML=t.brand.values.map((v,i)=>`
    <div class="val-cell" data-letter="${v.letter}"
      style="border-right:${i%2===0?'1px solid var(--line)':'none'};border-bottom:${i<2?'1px solid var(--line)':'none'};">
      <span class="val-num">${v.num}</span><p class="val-title">${v.title}</p><p class="val-desc">${v.desc}</p>
    </div>`).join('');

  document.getElementById('d-label').textContent=t.diagnosis.label;
  document.getElementById('d-headline').textContent=t.diagnosis.headline;
  document.getElementById('d-sub').textContent=t.diagnosis.sub;
  document.getElementById('d-cta').textContent=t.diagnosis.cta;
  document.getElementById('d-cap1').textContent=t.diagnosis.cap1;
  document.getElementById('d-cap2').textContent=t.diagnosis.cap2;
  document.getElementById('diagBadges').innerHTML=t.diagnosis.badges.map(b=>
    `<span class="d-badge"><span class="d-badge-dot"></span>${b}</span>`).join('');

  document.getElementById('s-label').textContent=t.services.label;
  document.getElementById('s-note').textContent=t.services.note;
  document.getElementById('svcList').innerHTML=t.services.items.map(s=>`
    <div class="svc-row"><span class="svc-idx">${s.idx}</span>
    <div><p class="svc-name">${s.name}</p><p class="svc-desc">${s.desc}</p></div>
    <span class="eyebrow" style="font-size:9px;white-space:nowrap;">${t.services.cs}</span></div>`).join('');

  document.getElementById('faq-label').textContent=t.faq.label;
  document.getElementById('faq-headline').textContent=t.faq.headline;
  document.getElementById('faqList').innerHTML=t.faq.items.map((item,i)=>`
    <div class="faq-item">
      <button class="faq-q" data-i="${i}" aria-expanded="false">
        <span class="faq-q-text">${item.q}</span><span class="faq-icon">+</span>
      </button>
      <p class="faq-a">${item.a}</p>
    </div>`).join('');
  document.querySelectorAll('.faq-q').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const a=btn.nextElementSibling, icon=btn.querySelector('.faq-icon'), isOpen=a.classList.contains('open');
      document.querySelectorAll('.faq-a').forEach(el=>el.classList.remove('open'));
      document.querySelectorAll('.faq-icon').forEach(el=>el.classList.remove('open'));
      document.querySelectorAll('.faq-q').forEach(el=>el.setAttribute('aria-expanded','false'));
      if(!isOpen){a.classList.add('open');icon.classList.add('open');btn.setAttribute('aria-expanded','true');}
    });
  });

  document.getElementById('c-label').textContent=t.cta.label;
  document.getElementById('c-headline').textContent=t.cta.headline;
  document.getElementById('c-sub').textContent=t.cta.sub;
  document.getElementById('c-cta1').textContent=t.cta.cta1;
  document.getElementById('c-cta2').textContent=t.cta.cta2;
  document.getElementById('c-blog').textContent=t.cta.blog;
  document.getElementById('f-langlabel').textContent=t.footer.langLabel;
  document.getElementById('f-copy').textContent=t.footer.copy;
  document.getElementById('f-blog').textContent=t.footer.blog;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
}

function renderHook(){
  const item=I18N[lang].hooks.items[hookIdx];
  const m=document.getElementById('hook-main'),s=document.getElementById('hook-sub');
  m.style.animation='none';s.style.animation='none';
  requestAnimationFrame(()=>{m.style.animation='fadeUp .45s ease both';s.style.animation='fadeUp .45s .06s ease both';m.textContent=item.main;s.textContent=item.sub;});
}
function renderHookDots(){
  const len=I18N[lang].hooks.items.length;
  document.getElementById('hookDots').innerHTML=Array.from({length:len},(_,i)=>
    `<button class="hook-dot" data-i="${i}" style="width:${i===hookIdx?20:4}px;background:${i===hookIdx?'var(--text)':'var(--dim)'};"></button>`).join('');
  document.getElementById('hookDots').querySelectorAll('.hook-dot').forEach(b=>
    b.addEventListener('click',()=>{hookIdx=+b.dataset.i;renderHook();renderHookDots();resetHookTimer();}));
}
function nextHook(){hookIdx=(hookIdx+1)%I18N[lang].hooks.items.length;renderHook();renderHookDots();}
function prevHook(){hookIdx=(hookIdx-1+I18N[lang].hooks.items.length)%I18N[lang].hooks.items.length;renderHook();renderHookDots();}
function resetHookTimer(){clearInterval(hookTimer);hookTimer=setInterval(nextHook,4200);}
resetHookTimer();
let sx=0;
const hc=document.getElementById('hookContent');
hc.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;},{passive:true});
hc.addEventListener('touchend',e=>{const d=sx-e.changedTouches[0].clientX;if(Math.abs(d)>40){d>0?nextHook():prevHook();resetHookTimer();}});
hc.addEventListener('mousedown',e=>{sx=e.clientX;});
hc.addEventListener('mouseup',e=>{const d=sx-e.clientX;if(Math.abs(d)>40){d>0?nextHook():prevHook();resetHookTimer();}});
document.getElementById('hookNext').addEventListener('click',()=>{nextHook();resetHookTimer();});
document.getElementById('hookPrev').addEventListener('click',()=>{prevHook();resetHookTimer();});

window.addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',window.scrollY>30));
let dOpen=false;
document.getElementById('hamburger').addEventListener('click',()=>{
  dOpen=!dOpen;
  document.getElementById('drawer').classList.toggle('open',dOpen);
  document.body.style.overflow=dOpen?'hidden':'';
  const b=[0,1,2].map(i=>document.getElementById('hb'+i));
  if(dOpen){b[0].style.transform='translateY(6.5px) rotate(45deg)';b[1].style.opacity='0';b[1].style.transform='scaleX(0)';b[2].style.transform='translateY(-6.5px) rotate(-45deg)';}
  else b.forEach(x=>{x.style.transform='none';x.style.opacity='1';});
});
document.querySelectorAll('.lang-btn').forEach(b=>b.addEventListener('click',()=>{lang=b.dataset.lang;hookIdx=0;render();}));
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting)x.target.classList.add('in');}),{threshold:.07});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
render();
</script>
</body>
</html>
