<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f5f0e8" />
  <title>ARVO STUDIO</title>
  <meta name="description" content="ARVO 아르보 | 서울 두피문신 SMP | 0.1mm Micro Dot" />
  <meta property="og:title" content="ARVO STUDIO" />
  <meta property="og:description" content="서울 두피문신 SMP · 0.1mm Micro Dot · 2026.05 Open" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #f5f0e8;
      --bg2:     #ede7da;
      --bg3:     #e4dccf;
      --text:    #2e2620;
      --muted:   #7a6e62;
      --dim:     #b5a898;
      --line:    rgba(46,38,32,.1);
      --line2:   rgba(46,38,32,.15);
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    html,body{height:100%;}
    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
      font-weight:400;font-size:15px;
      -webkit-font-smoothing:antialiased;
      display:flex;align-items:center;justify-content:center;
      min-height:100svh;
      padding:52px 24px 60px;
    }

    /* 배경 그라디언트 */
    body::before{
      content:'';position:fixed;inset:0;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(190,165,130,.18) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 85%, rgba(160,140,110,.14) 0%, transparent 55%);
      pointer-events:none;z-index:0;
    }

    .wrap{
      position:relative;z-index:1;
      width:100%;max-width:390px;
      display:flex;flex-direction:column;
      align-items:center;
    }

    /* ── 프로필 ── */
    .profile{
      display:flex;flex-direction:column;
      align-items:center;gap:14px;
      margin-bottom:40px;text-align:center;
    }

    /* A 모노그램 — 동그라미 없이 텍스트만 */
    .monogram{
      font-family:'Playfair Display',serif;
      font-size:36px;font-style:italic;font-weight:400;
      color:var(--text);
      letter-spacing:0;
      line-height:1;
      margin-bottom:2px;
      opacity:.55;
    }

    .logo{
      font-family:'Playfair Display',serif;
      font-size:22px;font-style:italic;font-weight:400;
      letter-spacing:.2em;color:var(--text);
    }
    .tagline{
      font-size:12px;font-weight:400;
      color:var(--muted);
      letter-spacing:.06em;line-height:1.8;
    }
    .open-badge{
      display:inline-flex;align-items:center;gap:9px;
      background:var(--bg3);
      border:1px solid var(--line2);
      padding:8px 18px;
      font-size:11px;font-weight:500;
      letter-spacing:.1em;color:var(--text);
    }
    .open-dot{
      width:6px;height:6px;border-radius:50%;
      background:#6aaa7a;flex-shrink:0;
      animation:pulse 2.2s infinite;
    }
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.4)}}

    /* ── 섹션 레이블 ── */
    .section-label{
      width:100%;
      font-size:9px;letter-spacing:.24em;text-transform:uppercase;
      color:var(--dim);font-weight:400;
      margin-bottom:10px;padding:0 2px;
    }

    /* ── 링크 버튼 공통 ── */
    .links{width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}

    .link-btn{
      display:flex;align-items:center;gap:14px;
      width:100%;padding:17px 20px;
      text-decoration:none;
      font-family:'Noto Sans KR',sans-serif;
      border:1px solid var(--line);
      transition:transform .18s, filter .15s;
      cursor:pointer;
    }
    .link-btn:hover{transform:translateY(-2px);filter:brightness(.97);}
    .link-btn:active{transform:translateY(0);filter:brightness(.94);}

    .link-icon{font-size:18px;line-height:1;flex-shrink:0;width:26px;text-align:center;}
    .link-text{flex:1;}
    .link-title{display:block;font-size:14px;font-weight:500;margin-bottom:2px;letter-spacing:.01em;}
    .link-sub{display:block;font-size:11px;font-weight:400;letter-spacing:.03em;}
    .link-arrow{font-size:12px;flex-shrink:0;opacity:.35;}

    /* 카카오 — 배경보다 살짝 진한 웜 베이지, 카카오 노랑은 왼쪽 선으로만 */
    .btn-kakao{
      background:var(--bg2);
      border-color:var(--line);
      border-left:3px solid #c9a520;
      color:var(--text);
    }
    .btn-kakao .link-title{color:#7a5c00;}
    .btn-kakao .link-sub{color:var(--muted);}
    .btn-kakao .link-arrow{color:#7a5c00;opacity:.5;}

    /* 홈페이지 — 배경보다 한 단계 진한 베이지, 왼쪽 선으로 구분 */
    .btn-website{
      background:var(--bg3);
      border-color:var(--line);
      border-left:3px solid var(--text);
      color:var(--text);
    }
    .btn-website .link-title{color:var(--text);}
    .btn-website .link-sub{color:var(--muted);}
    .btn-website .link-arrow{color:var(--text);opacity:.35;}

    /* 블로그 — 같은 계열, 왼쪽 선만 초록으로 */
    .btn-blog{
      background:var(--bg2);
      border-color:var(--line);
      border-left:3px solid #4a7c59;
      color:var(--text);
    }
    .btn-blog .link-title{color:#2e5c3a;}
    .btn-blog .link-sub{color:var(--muted);}
    .btn-blog .link-arrow{color:#4a7c59;opacity:.6;}

    /* 구분선 */
    .divider{width:100%;border:none;border-top:1px solid var(--line);margin:16px 0;}

    /* 푸터 */
    .footer{
      margin-top:40px;
      font-size:11px;color:var(--dim);
      letter-spacing:.1em;text-align:center;
      font-family:'Playfair Display',serif;font-style:italic;
    }

    /* 애니메이션 */
    @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .profile        {animation:fadeUp .6s .05s ease both;}
    .section-label  {animation:fadeUp .6s .15s ease both;}
    .links          {animation:fadeUp .6s .20s ease both;}
    .divider        {animation:fadeUp .6s .28s ease both;}
    .footer         {animation:fadeUp .6s .40s ease both;}
  </style>
</head>
<body>
<div class="wrap">

  <div class="profile">
    <div class="monogram">A</div>
    <div class="logo">ARVO STUDIO</div>
    <div class="tagline">
      서울 두피문신 SMP · 0.1mm Micro Dot<br />
      개인별 두피 맞춤 모근 설계
    </div>
    <div class="open-badge">
      <span class="open-dot"></span>
      2026 · 05 · Seoul Open
    </div>
  </div>

  <p class="section-label">상담 · Consultation</p>
  <div class="links">
    <a href="http://pf.kakao.com/_ZAyxlX/chat" target="_blank" class="link-btn btn-kakao">
      <span class="link-icon">💬</span>
      <span class="link-text">
        <span class="link-title">카카오 채널 상담</span>
        <span class="link-sub">빠른 상담 · 사전 예약</span>
      </span>
      <span class="link-arrow">↗</span>
    </a>
  </div>

  <hr class="divider" />

  <p class="section-label">콘텐츠 · Content</p>
  <div class="links">
    <a href="https://arvo-studio.vercel.app" target="_blank" class="link-btn btn-website">
      <span class="link-icon">🌐</span>
      <span class="link-text">
        <span class="link-title">공식 홈페이지</span>
        <span class="link-sub">브랜드 · 서비스 · 두피 진단 안내</span>
      </span>
      <span class="link-arrow">↗</span>
    </a>

    <a href="https://blog.naver.com/the_arvo_studio" target="_blank" class="link-btn btn-blog">
      <span class="link-icon">📝</span>
      <span class="link-text">
        <span class="link-title">네이버 블로그</span>
        <span class="link-sub">SMP 정보 · 시술 이야기</span>
      </span>
      <span class="link-arrow">↗</span>
    </a>
  </div>

  <p class="footer">© 2026 ARVO Studio · Seoul</p>

</div>
</body>
</html>
